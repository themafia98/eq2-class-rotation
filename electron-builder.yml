appId: com.eq2.rotationadvisor
productName: EQ2 Rotation Advisor

# What goes inside the app (read-only). Editable config.json + data/ are seeded
# into the user's data folder on first run (see advisor/main.cjs).
files:
  - advisor/**/*
  - data/**/*
  - package.json
# don't ship the dev-only bits
  - "!advisor/*.test.mjs"
  - "!advisor/headless.mjs"
  - "!advisor/sample.log"

directories:
  output: dist-exe

win:
  target:
    - nsis        # friendly installer (wizard + Start-menu/desktop shortcut)
    - portable    # single self-contained .exe, no install

# Installer: per-user (no admin/UAC prompt), simple wizard, makes shortcuts.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EQ2 Rotation Advisor
  artifactName: EQ2-Rotation-Advisor-Setup-${version}.exe

portable:
  artifactName: EQ2-Rotation-Advisor-${version}-portable.exe

# Lets `electron-builder --publish` push the built exe straight to GitHub Releases.
publish:
  provider: github
  owner: themafia98
  repo: eq2-class-rotation
  releaseType: release   # publish directly (not a draft) so CI tag-releases are immediately visible
