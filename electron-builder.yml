appId: com.eq2.rotationadvisor
productName: EQ2 Rotation Advisor

# Package the esbuild output (build/ contains main.cjs, preload.cjs, renderer/, assets/, data/).
files:
  - build/**
  - package.json

directories:
  output: dist-exe

win:
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EQ2 Rotation Advisor
  artifactName: EQ2-Rotation-Advisor-Setup-${version}.exe

portable:
  artifactName: EQ2-Rotation-Advisor-${version}-portable.exe

publish:
  provider: github
  owner: themafia98
  repo: eq2-class-rotation
  releaseType: release
