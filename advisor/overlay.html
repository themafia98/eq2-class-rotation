<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif; -webkit-user-select: none; user-select: none; }
  .card { height: 100%; background: rgba(16,18,24,0.86); color: #e8eaf0;
    border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 8px 10px;
    display: flex; flex-direction: column; gap: 6px; }
  .head { display:flex; align-items:center; justify-content:space-between; -webkit-app-region: drag; }
  .cls { font-size: 11px; letter-spacing: .5px; color:#9aa4b2; text-transform: uppercase; }
  .tabs { display:flex; gap:4px; -webkit-app-region: no-drag; }
  .tab { font-size: 10px; padding: 2px 6px; border-radius: 6px; cursor: pointer;
    color:#aeb6c2; background: rgba(255,255,255,0.05); }
  .tab.active { color:#0b0d12; background:#f2c14e; font-weight:600; }
  .next-label { font-size: 10px; color:#8b93a1; text-transform: uppercase; letter-spacing:1px; }
  .next { font-size: 24px; font-weight: 700; line-height:1.1; color:#6ee7a8; word-break: break-word; }
  .next.waiting { color:#8b93a1; font-size:16px; font-weight:600; }
  .next-note { font-size: 10px; color:#8b93a1; margin-top:1px; }
  .queue { display:flex; flex-direction:column; gap:3px; margin-top:2px; }
  .q { display:flex; align-items:center; gap:6px; font-size: 11px; }
  .q .name { flex: 0 0 42%; color:#c7cdd6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .q .barwrap { flex:1; height:6px; background: rgba(255,255,255,0.06); border-radius:4px; overflow:hidden; }
  .q .bar { height:100%; background:#5b8def; width:0%; }
  .q .t { flex: 0 0 34px; text-align:right; color:#8b93a1; font-variant-numeric: tabular-nums; }
  .q.ready .t { color:#6ee7a8; }
  .q.ready .bar { background:#6ee7a8; }
  .refresh { display:flex; flex-wrap:wrap; gap:4px; margin-top:2px; }
  .pill { font-size:10px; padding:2px 6px; border-radius:10px; background: rgba(242,193,78,0.18);
    color:#f2c14e; border:1px solid rgba(242,193,78,0.35); }
  .foot { margin-top:auto; display:flex; align-items:center; justify-content:space-between;
    font-size:9px; color:#6b7280; -webkit-app-region: drag; }
  .dot { width:7px; height:7px; border-radius:50%; background:#e0574a; display:inline-block; margin-right:4px; }
  .dot.on { background:#6ee7a8; }
  .gear { display:none; -webkit-app-region: no-drag; cursor: pointer; margin-left:6px; opacity:.7; }
  .gear:hover { opacity:1; }
  .err { color:#e0574a; font-size:11px; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <span class="cls" id="cls">EQ2</span>
      <span class="tabs" id="tabs"></span>
    </div>
    <div>
      <div class="next-label">Next</div>
      <div class="next waiting" id="next">connecting…</div>
      <div class="next-note" id="nextNote"></div>
    </div>
    <div class="queue" id="queue"></div>
    <div class="refresh" id="refresh"></div>
    <div class="foot">
      <span><span class="dot" id="dot"></span><span id="status">no log</span></span>
      <span><span id="hint">Ctrl+Alt+O click-through · H/S/D/R role</span>
        <span class="gear" id="gear" title="Open settings folder (config.json + data)">⚙</span></span>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  let roles = [];
  let currentRole = null;
  const CD_SCALE = 30; // seconds mapped to a full bar

  function renderTabs() {
    const box = $("tabs");
    box.innerHTML = "";
    for (const r of roles) {
      const el = document.createElement("span");
      el.className = "tab" + (r.id === currentRole ? " active" : "");
      el.textContent = r.label;
      el.onclick = () => window.advisor.setRole(r.id);
      box.appendChild(el);
    }
  }

  function renderState(s) {
    if (s.error) {
      $("next").className = "next err";
      $("next").textContent = s.error;
      $("nextNote").textContent = "";
      $("queue").innerHTML = "";
      $("refresh").innerHTML = "";
      return;
    }
    if (s.roleId) currentRole = s.roleId;
    // NEXT
    const n = $("next");
    if (s.next) {
      n.className = "next";
      n.textContent = s.next.name;
      $("nextNote").textContent = s.next.note || "";
    } else {
      n.className = "next waiting";
      n.textContent = "waiting… (all on cooldown)";
      $("nextNote").textContent = "";
    }
    // QUEUE
    const q = $("queue");
    q.innerHTML = "";
    for (const item of s.queue) {
      const row = document.createElement("div");
      row.className = "q" + (item.ready ? " ready" : "");
      const pct = item.ready ? 100 : Math.max(4, 100 - Math.min(item.remaining / CD_SCALE, 1) * 100);
      row.innerHTML =
        '<span class="name"></span><span class="barwrap"><span class="bar"></span></span>' +
        '<span class="t"></span>';
      row.querySelector(".name").textContent = item.name;
      row.querySelector(".bar").style.width = pct + "%";
      row.querySelector(".t").textContent = item.ready ? "rdy" : item.remaining + "s";
      q.appendChild(row);
    }
    // REFRESH
    const rf = $("refresh");
    rf.innerHTML = "";
    for (const r of s.refresh) {
      const p = document.createElement("span");
      p.className = "pill";
      p.textContent = "⟳ " + r.name;
      rf.appendChild(p);
    }
    renderTabs();
  }

  function applyMeta(m) {
    if (m.class) $("cls").textContent = m.class;
    if (m.roles) roles = m.roles;
    if (m.role) currentRole = m.role;
    if ("logFile" in m) {
      $("dot").className = "dot" + (m.logFile ? " on" : "");
      $("status").textContent = m.logFile ? "log connected" : "no log — set config";
    }
    if ("clickThrough" in m) {
      $("hint").textContent = (m.clickThrough ? "click-through ON" : "click-through OFF") + " · Ctrl+Alt+O";
    }
    if ("settingsDir" in m) {
      const g = $("gear");
      g.style.display = m.settingsDir ? "inline" : "none";
      if (m.settingsDir) g.title = "Open settings folder:\n" + m.settingsDir;
    }
    renderTabs();
  }

  $("gear").onclick = () => window.advisor.openSettings();

  window.advisor.onState(renderState);
  window.advisor.onMeta(applyMeta);
</script>
</body>
</html>
